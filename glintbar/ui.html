<meta charset="utf-8">
<style>
  :root{
    --bg:#1e1f22; --line:#33353a; --text:#e6edf3; --dim:#9aa4af;
    --ok:#58a6ff; --warn:#d29922; --crit:#f85149;
    --valsize:13px; --lblsize:9px; --pad:9px; --cw:40px; --ch:16px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--text);
        font:12px/1 "Segoe UI",system-ui,sans-serif; user-select:none; overflow:hidden; }
  body.size-S{ --valsize:12px; --lblsize:8px; --pad:6px; --cw:30px; --ch:14px; }
  body.size-L{ --valsize:16px; --lblsize:10px; --pad:12px; --cw:54px; --ch:20px; }
  #bar{ position:relative; display:flex; align-items:center; justify-content:flex-start;
        height:100vh; padding:0 2px; }
  #grip{ flex:0 0 auto; color:var(--dim); font-size:11px; padding:0 5px;
         cursor:move; letter-spacing:-1px; }
  body.embedded #grip{ display:none; }
  /* The chips are the one part of the bar allowed to be narrower than its
     content: when the taskbar gap can't hold every tile, they scroll sideways
     (pointer position drives it, see trackScroll) instead of the bar widening
     over the taskbar's buttons. Everything else - alerts, the recording dot,
     the controls - keeps its full width and stays reachable. */
  #chipwrap{ flex:0 1 auto; min-width:0; height:100%; position:relative; }
  #chips{ display:flex; align-items:center; height:100%; overflow-x:auto; overflow-y:hidden;
          scrollbar-width:none; }
  #chips::-webkit-scrollbar{ display:none; }
  /* edge fades: the cue that there is more to the side */
  #chipwrap::before, #chipwrap::after{ content:""; position:absolute; top:0; bottom:0; width:22px;
          pointer-events:none; opacity:0; transition:opacity .15s; }
  #chipwrap::before{ left:0; background:linear-gradient(90deg, var(--bg), transparent); }
  #chipwrap::after{ right:0; background:linear-gradient(270deg, var(--bg), transparent); }
  #chipwrap.more-left::before, #chipwrap.more-right::after{ opacity:1; }
  .chip{ flex:0 0 auto; display:flex; align-items:center; gap:5px;
         padding:0 var(--pad); height:100%; white-space:nowrap;
         border-right:1px solid var(--line); }
  .chip .lbl{ font-size:var(--lblsize); letter-spacing:.05em; text-transform:uppercase;
              color:var(--dim); }
  .chip .val{ font-size:var(--valsize); font-weight:600; font-variant-numeric:tabular-nums; }
  .chip .u{ font-size:var(--lblsize); color:var(--dim); font-weight:400; margin-left:-2px; }
  .chip canvas{ width:var(--cw); height:var(--ch); opacity:.7; }
  body.nospark .chip canvas{ display:none; }
  .val.ok{ color:var(--text); } .val.warn{ color:var(--warn); } .val.crit{ color:var(--crit); }
  #alerts{ flex:0 0 auto; display:flex; align-items:center; }
  .chip.alert{ background:#f8514922; border-right:1px solid var(--line);
    box-shadow:inset 2px 0 0 var(--crit); animation:alertpulse 1.4s ease-in-out infinite; }
  .chip.alert .ic{ color:var(--crit); font-size:12px; }
  @keyframes alertpulse{ 0%,100%{ background:#f8514922; } 50%{ background:#f8514936; } }
  #ctl{ flex:0 0 auto; display:flex; align-items:center; gap:2px; padding:0 4px 0 6px; }
  #ctl button{ background:transparent; color:var(--dim); border:none; font-size:12px;
               cursor:pointer; padding:3px 5px; border-radius:3px; line-height:1; }
  #ctl button:hover{ color:var(--text); background:#ffffff14; }
  #recdot{ display:none; flex:0 0 auto; width:8px; height:8px; border-radius:50%;
           background:var(--crit); margin:0 5px 0 3px; box-shadow:0 0 5px var(--crit);
           animation:recflash 1.1s ease-in-out infinite; }
  body.logging #recdot{ display:block; }
  @keyframes recflash{ 0%,100%{ opacity:1; } 50%{ opacity:.15; } }
</style>

<div id="bar">
  <div id="grip" class="pywebview-drag-region" title="Drag to move">⋮⋮</div>
  <div id="chipwrap"><div id="chips"></div></div>
  <div id="alerts"></div>
  <div id="recdot" title="Recording CSV"></div>
  <div id="ctl">
    <button id="setBtn"  title="Settings">⚙</button>
    <button id="closeBtn" title="Close">✕</button>
  </div>
</div>

<script>
const META = {
  gpu_temp:{lbl:"GPU°",unit:"°",warn:80,crit:87,max:100},
  gpu_util:{lbl:"GPU",unit:"%",warn:1e9,crit:1e9,max:100},
  gpu_mem_pct:{lbl:"VRAM",unit:"%",warn:85,crit:95,max:100},
  gpu_power:{lbl:"Pwr",unit:"W",warn:1e9,crit:1e9,max:130},
  gpu_clock:{lbl:"Clk",unit:"",warn:1e9,crit:1e9,max:2200,unitTxt:"MHz"},
  sys_temp:{lbl:"SYS",unit:"°",warn:85,crit:97,max:110},
  cpu_temp:{lbl:"CPU°",unit:"°",warn:85,crit:97,max:110},
  fan_rpm:{lbl:"Fan",unit:"",warn:1e9,crit:1e9,max:6000,unitTxt:"RPM"},
  cpu:{lbl:"CPU",unit:"%",warn:85,crit:95,max:100},
  ram_pct:{lbl:"RAM",unit:"%",warn:85,crit:95,max:100},
  net_mbps:{lbl:"Net",unit:"",warn:1e9,crit:1e9,max:50,dyn:true,unitTxt:"MB/s"},
  disk_mbps:{lbl:"Disk",unit:"",warn:1e9,crit:1e9,max:200,dyn:true,unitTxt:"MB/s"},
};

const chipsEl = document.getElementById("chips");
let nodes = {}, shownIds = [], lastCfgV = -1, sizePending = false;
let AVAIL = Object.keys(META);
// Temperatures are stored/compared in Celsius everywhere; only the display
// converts when the (config-only) temp_unit is "F".
const TEMP_IDS = new Set(["sys_temp", "cpu_temp", "gpu_temp"]);
let TEMP_UNIT = "C";

// Show/switch the detail popup on hover. Hiding is owned by the Python cursor
// watchdog (_detail_watchdog), which is robust when a DOM mouseleave never
// fires and lets you move onto the popup itself to read it.
function onChipEnter(id, el){
  const r = el.getBoundingClientRect();
  const center = r.left + r.width / 2;   // CSS px from the bar window's left edge
  try{ window.pywebview.api.show_detail(id, center); }catch(e){}
}

function buildChips(cfg){
  chipsEl.innerHTML = ""; nodes = {};
  shownIds = cfg.metrics.filter(id => AVAIL.includes(id));
  document.body.classList.toggle("size-S", cfg.size==="S");
  document.body.classList.toggle("size-L", cfg.size==="L");
  document.body.classList.toggle("nospark", !cfg.sparklines);
  for (const id of shownIds){
    const m = META[id]; if(!m) continue;
    const c = document.createElement("div"); c.className="chip"; c.id="chip_"+id;
    c.innerHTML = `<span class="lbl">${m.lbl}</span>`+
      `<span class="val ok" id="v_${id}">--</span>`+
      (m.unit?`<span class="u">${TEMP_IDS.has(id)?(TEMP_UNIT==="F"?"°F":"°C"):m.unit}</span>`:``)+
      `<canvas id="c_${id}" width="120" height="44"></canvas>`;
    chipsEl.appendChild(c);
    c.addEventListener("mouseenter", ()=> onChipEnter(id, c));
    nodes[id] = {chip:c, val:c.querySelector(`#v_${id}`), cv:c.querySelector(`#c_${id}`)};
  }
  sizePending = true;
}

function cls(m,v){ if(v==null)return"ok"; if(v>=m.crit)return"crit"; if(v>=m.warn)return"warn"; return"ok"; }
function fmt(v,id){ if(v==null)return"--";
  if(id==="net_mbps"||id==="disk_mbps"||id==="gpu_power")return v.toFixed(1); return Math.round(v); }
function gv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function color(c){ return c==="crit"?gv("--crit"):c==="warn"?gv("--warn"):gv("--ok"); }

function spark(cv,data,m,colr){
  const ctx=cv.getContext("2d"), w=cv.width, h=cv.height; ctx.clearRect(0,0,w,h);
  if(!data.length) return;
  let top=m.dyn?Math.max(...data,1)*1.15:m.max;
  const n=data.length, sx=w/Math.max(n-1,1);
  ctx.beginPath();
  data.forEach((v,i)=>{ const y=h-(Math.min((v==null?0:v),top)/top)*(h-4)-2; const x=i*sx;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.strokeStyle=colr; ctx.lineWidth=2.5; ctx.stroke();
  ctx.lineTo((n-1)*sx,h); ctx.lineTo(0,h); ctx.closePath(); ctx.fillStyle=colr+"22"; ctx.fill();
}

const wrapEl = document.getElementById("chipwrap");
const ctlEl = document.getElementById("ctl");
const recEl = document.getElementById("recdot");
const gripEl = document.getElementById("grip");

// Width of everything that never shrinks: grip (floating mode only), the alert
// tile(s), the recording dot, the controls, #bar's own padding. #chips is left
// out because it is the part that gives way (scrolls) when the gap is short.
function fixedWidthCss(){
  const w = el => (getComputedStyle(el).display === "none") ? 0 : el.offsetWidth;
  return w(gripEl) + w(alertsEl) + w(recEl) + ctlEl.offsetWidth + 4;
}

// What the bar needs to show every tile without scrolling. #chips.scrollWidth is
// its full content width whatever the window currently allows - the window may
// well be narrower than this, and that is fine: Python grants what the gap can
// hold and the chips scroll for the rest.
function neededWidthCss(){
  return Math.ceil(chipsEl.scrollWidth + fixedWidthCss()) + 3;
}

// --- side-scrolling chips, driven by the pointer --------------------------
// When the chips overflow, the pointer's position across them maps onto the
// scroll range: at the left edge you see the start, at the right edge the end,
// eased so entering mid-way glides rather than jumps. Wheel works too. Nothing
// is clipped silently: the fades say there is more, moving the mouse shows it.
let scrollTarget = null, scrollAnim = 0;
function overflowPx(){ return chipsEl.scrollWidth - chipsEl.clientWidth; }
function updateFades(){
  const over = overflowPx() > 1;
  wrapEl.classList.toggle("more-left", over && chipsEl.scrollLeft > 1);
  wrapEl.classList.toggle("more-right", over && chipsEl.scrollLeft < overflowPx() - 1);
}
function animateScroll(){
  scrollAnim = 0;
  if (scrollTarget == null) return;
  const before = chipsEl.scrollLeft, d = scrollTarget - before;
  // Snap inside one CSS px, and stop if a step made no progress: scrollLeft is
  // quantised to device pixels (0.57 CSS px at 175%), so a smaller threshold
  // left the loop re-arming every frame 0.7px short of the edge, with the
  // edge fade stuck on. Found by the browser check, not by eye.
  if (Math.abs(d) >= 1) chipsEl.scrollLeft = before + d * 0.25;
  if (Math.abs(d) < 1 || chipsEl.scrollLeft === before){
    chipsEl.scrollLeft = scrollTarget; scrollTarget = null; updateFades(); return;
  }
  scrollAnim = requestAnimationFrame(animateScroll);
}
function trackScroll(e){
  const over = overflowPx();
  if (over <= 1) return;
  const r = chipsEl.getBoundingClientRect();
  const edge = Math.min(28, r.width / 4);            // dead zone at each end: easy to park
  const t = Math.max(0, Math.min(1, (e.clientX - r.left - edge) / Math.max(1, r.width - 2 * edge)));
  scrollTarget = t * over;
  if (!scrollAnim) scrollAnim = requestAnimationFrame(animateScroll);
}
chipsEl.addEventListener("mousemove", trackScroll);
chipsEl.addEventListener("wheel", e => {
  if (overflowPx() <= 1) return;
  scrollTarget = null;
  chipsEl.scrollLeft += (e.deltaX || e.deltaY);
  e.preventDefault();
}, {passive:false});
chipsEl.addEventListener("scroll", updateFades);
window.addEventListener("resize", updateFades);

const alertsEl = document.getElementById("alerts");
const CRIT = {}; for (const id in META) if (META[id].crit < 1e8) CRIT[id] = META[id].crit;
let alertState = {}, alertKey = "", alertNaturalW = 0;
const MIN_CHIP_STRIP_CSS = 120;   // keep at least this much of the chips visible before shedding an alert

// Additive critical alert: a tile appears only on a sustained critical breach,
// stays through a hysteresis/cooldown, and never displaces your chosen tiles.
function updateAlerts(st){
  if (st.config.alerts === false){
    if (alertsEl.childElementCount){ alertsEl.innerHTML=""; alertKey=""; sizePending=true; }
    alertState = {};
    return;
  }
  const soundOn = st.config.sound !== false;
  const active = [];
  for (const id of AVAIL){
    const crit = CRIT[id]; if (crit == null) continue;
    const v = st.latest[id]; if (v == null) continue;
    let s = alertState[id] || {on:false, ec:0, cc:0};
    if (!s.on){
      if (v >= crit){ if (++s.ec >= 2){ s.on = true; s.cc = 0;   // 2s sustained to enter
        if (soundOn){ try{ window.pywebview.api.beep(); }catch(e){} } } }
      else s.ec = 0;
    } else {
      if (v < crit * 0.97){ if (++s.cc >= 8) { s.on = false; s.ec = 0; } }  // 8s below to clear
      else s.cc = 0;
    }
    alertState[id] = s;
    if (s.on) active.push(id);
  }
  const key = active.join(",");
  if (key !== alertKey){
    alertsEl.innerHTML = "";
    for (const id of active){
      const m = META[id];
      const el = document.createElement("div"); el.className = "chip alert";
      el.innerHTML = `<span class="ic">⚠</span><span class="lbl">${m.lbl}</span>`+
        `<span class="val crit" id="av_${id}">${fmt(st.latest[id],id)}</span>`+
        (m.unit ? `<span class="u">${m.unit}</span>` : ``);
      alertsEl.appendChild(el);
    }
    alertKey = key; sizePending = true;
  } else {
    for (const id of active){ const e=document.getElementById("av_"+id); if(e) e.textContent=fmt(st.latest[id],id); }
  }
}

async function tick(){
  let st; try{ st = await window.pywebview.api.get_state(); }catch(e){ return; }
  if (st.embedded) document.body.classList.add("embedded");   // latch: hides the drag grip
  if (st.available) AVAIL = st.available;
  TEMP_UNIT = (st.config && st.config.temp_unit==="F") ? "F" : "C";
  if (st.cfgv !== lastCfgV){ buildChips(st.config); lastCfgV = st.cfgv; }
  for (const id of shownIds){
    const m=META[id], v=st.latest[id], c=cls(m,v), N=nodes[id]; if(!N) continue;   // colour uses raw °C
    const dv = (v!=null && TEMP_IDS.has(id) && TEMP_UNIT==="F") ? v*9/5+32 : v;
    N.val.className="val "+c; N.val.textContent=fmt(dv,id);
    if(st.config.sparklines) spark(N.cv, st.hist[id]||[], m, color(c));
  }
  updateAlerts(st);
  const wasLogging = document.body.classList.contains("logging");
  document.body.classList.toggle("logging", !!st.logging);
  if(st.logging) document.getElementById("recdot").title =
    "Recording CSV → "+(st.logfile||"")+" (stop in settings)";
  if(!!st.logging !== wasLogging) sizePending = true;   // dot appeared/disappeared: re-fit width
  // auto-fit the embedded bar to its content width
  if(st.embedded){
    // safety net: if the window drifted much wider than its content, re-fit
    if(!sizePending && window.innerWidth - neededWidthCss() > 120) sizePending = true;
    if(sizePending){
      // setTimeout, not requestAnimationFrame: the bar is born hidden and is
      // first shown by this very request, and Chromium does not run animation
      // frames in a hidden window - a rAF here would wait for a show that is
      // waiting for it. Reading offsetWidth/scrollWidth forces layout anyway.
      setTimeout(async ()=>{
        const ok = await window.pywebview.api.request_size(neededWidthCss());
        if(ok) sizePending = false;
        updateFades();
      }, 0);
    }
    // The gap can be too tight for everything (a busy taskbar, an alert that
    // just appeared). The chips give way by scrolling; the alert tile does not
    // shrink, so on a bar too narrow to show it alongside a useful strip of
    // chips, drop it rather than leave a strip of chips too short to read:
    // alerts are additive and automatic, safe to shed under space pressure,
    // unlike a metric you chose to show. Decided from the alert's own natural
    // width, measured while displayed, so hiding it cannot change the number
    // the decision is made from (an earlier version measured layout after
    // hiding and flickered on/off once a second).
    if (alertsEl.childElementCount){
      if (alertsEl.style.display !== "none") alertNaturalW = alertsEl.offsetWidth;
      const room = window.innerWidth - (fixedWidthCss() - (alertsEl.style.display === "none" ? 0 : alertNaturalW));
      alertsEl.style.display = (room - alertNaturalW < MIN_CHIP_STRIP_CSS) ? "none" : "";
    }
  }
}

document.getElementById("setBtn").onclick   = ()=> window.pywebview.api.open_settings();
document.getElementById("closeBtn").onclick = ()=> window.pywebview.api.close();

window.addEventListener("pywebviewready", ()=>{ tick(); setInterval(tick, 1000); });
</script>
