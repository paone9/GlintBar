name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dev tools
        run: python -m pip install .[dev]
      - name: Compile
        run: python -m compileall glintbar
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Security scan (bandit)
        run: python -m bandit -r . --severity-level medium

  # Unit tests run on Windows: the module imports Windows-only stdlib (winsound,
  # ctypes.wintypes) and probes hardware at import, so it can't load on ubuntu.
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # the floor promised in pyproject, and a current release
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev tools
        run: python -m pip install .[dev]
      - name: Unit tests (pytest)
        run: python -m pytest tests -q
