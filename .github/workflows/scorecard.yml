name: Scorecard

# OpenSSF Scorecard: an objective, third-party check of this repo's security
# posture (pinned actions, branch protection, no dangerous workflow patterns,
# etc.). Results feed the badge in the README and the repo's Security tab.

on:
  branch_protection_rule:
  schedule:
    - cron: "20 7 * * 1"   # weekly, Monday 07:20 UTC
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to the Security tab
      id-token: write          # publish results for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
