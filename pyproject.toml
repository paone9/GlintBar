[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "glintbar"
version = "1.3.0"
description = "A slim always-on-top hardware monitor that lives in the empty part of the Windows taskbar."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "paone9" }]
keywords = ["hardware-monitor", "taskbar", "windows", "gpu", "cpu", "temperature", "system-monitor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pywebview>=6.2.1",
    "psutil>=7.2.2",
    # pywebview/psutil are mature 1.0+ libraries, so a bare floor is right for them.
    # taskbargap is a self-declared alpha (Development Status :: 3 - Alpha) that
    # documents its own API can change between 0.x minor releases - a bare floor
    # would silently accept a future breaking release on every new install, while
    # this machine and any warm-cache install kept working. Pin the minor.
    # 0.2 is required: it measures the Windows 11 taskbar through UI Automation
    # (so the bar never sits on the Widgets button) and adds taskbar_items().
    "taskbargap~=0.2.0",
]

[project.optional-dependencies]
# Dev + CI tools, pinned to the tested versions (Dependabot bumps them). One
# dependency source for the whole project: `pip install .[dev]`, no separate
# requirements files.
dev = [
    "ruff==0.17.2",
    "bandit==1.9.4",
    "pytest==9.1.1",
]

[project.urls]
Homepage = "https://github.com/paone9/GlintBar"
Issues = "https://github.com/paone9/GlintBar/issues"

# gui-scripts (not scripts) so the installed `glintbar` command launches with
# pythonw on Windows: no stray console window.
[project.gui-scripts]
glintbar = "glintbar.monitor:main"

[tool.setuptools]
packages = ["glintbar"]

[tool.setuptools.package-data]
glintbar = ["*.html"]

[tool.ruff.lint]
# Broad catches are policy here, not oversight: a monitor that dies because one
# sensor, driver or Win32 call failed is worse than a tile that shows nothing.
# A failed read leaves that reading missing; the rest of the bar keeps going.
# (bandit's matching check, B110, is low severity and below the CI threshold.)
extend-ignore = ["BLE001", "S110"]
